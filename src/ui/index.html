<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%B7%3C/text%3E%3C/svg%3E">
  <title>Tiny Slideshow</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>{{ css }}</style>
</head>
<body>
  <header class="header">
    <div class="header__title"><h1 id="folder"></h1><span id="count"></span></div>
    <div class="header__actions">
      <button class="icon-button" id="open-map" aria-label="Open map" title="Open map"><svg viewBox="0 0 24 24"><path d="M9 18l-6 3V6l6-3 6 3 6-3v15l-6 3-6-3zM9 3v15M15 6v15"/></svg></button>
      <button class="icon-button" id="fullscreen" aria-label="Toggle fullscreen" title="Toggle fullscreen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
    </div>
  </header>
  <main><div class="grid" id="grid"></div><p class="empty" id="empty" hidden>No photos or videos found.</p></main>
  <footer class="footer">Made with <span aria-label="love">♥</span> in Antibes</footer>
  <div class="map-view" id="map-view" hidden role="dialog" aria-modal="true" aria-label="Photo map">
    <div id="map" class="map-view__map"></div>
    <p class="map-view__message" id="map-message" hidden></p>
    <button class="icon-button map-view__close" id="close-map" aria-label="Close map"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
    <div class="toolbar map-view__toolbar" id="map-toolbar">
      <button class="icon-button" id="toggle-route" aria-label="Hide route" title="Hide route" aria-pressed="true"><svg viewBox="0 0 24 24"><circle cx="5" cy="18" r="2"/><circle cx="19" cy="6" r="2"/><path d="M7 18h4a3 3 0 0 0 0-6h-1a3 3 0 0 1 0-6h7"/></svg></button>
      <button class="icon-button" id="map-global" aria-label="Show all locations" title="Show all locations"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c-3 3-4 6-4 9s1 6 4 9M12 3c3 3 4 6 4 9s-1 6-4 9"/></svg></button>
    </div>
  </div>
  <div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-label="Slideshow">
    <button class="icon-button viewer__close" id="close" aria-label="Close slideshow"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
    <div class="viewer__media" id="media"></div>
    <div class="toolbar">
      <button class="icon-button" id="previous" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="icon-button" id="play" aria-label="Play slideshow"><svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></svg></button>
      <button class="icon-button" id="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      <button class="icon-button" id="media-map" aria-label="Show on map" title="Show on map" hidden><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.4-7-12a7 7 0 0 1 14 0c0 5.6-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg></button>
      <div class="settings">
        <button class="icon-button" id="settings" aria-label="Slideshow settings" aria-expanded="false" aria-controls="settings-menu"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
        <div class="settings__menu" id="settings-menu" hidden>
          <label for="interval">Slideshow interval</label>
          <select id="interval">
            <option value="2">2 seconds</option>
            <option value="3">3 seconds</option>
            <option value="5" selected>5 seconds</option>
            <option value="8">8 seconds</option>
            <option value="10">10 seconds</option>
            <option value="15">15 seconds</option>
          </select>
        </div>
      </div>
    </div>
  </div>
  <script>const slideshow = {{ data }};</script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>{{ js }}</script>
</body>
</html>
